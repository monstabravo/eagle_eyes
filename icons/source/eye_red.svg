<?xml version="1.0" encoding="UTF-8"?>
<!--
  Eagle Eyes — extension icon (recording state, shown while a session is active).
  Re-export to PNG at 16/32/48/128 px and drop into ../icon{16,32,48,128}_red.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="iris-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <path d="M64 26 C 30 26, 8 56, 8 64 C 8 72, 30 102, 64 102 C 98 102, 120 72, 120 64 C 120 56, 98 26, 64 26 Z"
        fill="#0f172a" stroke="#fecaca" stroke-width="4" stroke-linejoin="round"/>

  <circle cx="64" cy="64" r="28" fill="url(#iris-red)"/>
  <circle cx="64" cy="64" r="12" fill="#0b1220"/>
  <circle cx="56" cy="56" r="5" fill="#ffffff" opacity="0.85"/>

  <!-- Recording dot in upper-right -->
  <circle cx="100" cy="28" r="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
</svg>
